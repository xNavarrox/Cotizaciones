<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidrios Templados Lopez - Presupuesto</title>
    <link rel="stylesheet" href="presupuesto.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1 class="company-name">Vidrios Templados Lopez</h1>
            <div class="logo">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="presupuesto-container">
            <h2 class="page-title">Nuevo Presupuesto</h2>

            <section class="info-section">
                <h3 class="section-title">Información del Cliente</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombreCliente">Nombre</label>
                        <input type="text" id="nombreCliente" name="nombreCliente" placeholder="Nombre completo del cliente">
                    </div>
                    <div class="form-group">
                        <label for="numeroCliente">Número de Teléfono</label>
                        <input type="tel" id="numeroCliente" name="numeroCliente" placeholder="Ej: 449-123-4567">
                    </div>
                    <div class="form-group">
                        <label for="tipoDocumento">Tipo de Documento</label>
                        <select id="tipoDocumento" name="tipoDocumento">
                            <option value="Presupuesto">Cotización</option>
                            <option value="Nota">Nota</option>
                        </select>
                    </div>
                </div>
            </section>

            <div id="contenedor-vidrios"></div>

            <div class="precio-actions-container">
                <div class="left-action">
                    <button type="button" class="btn btn-add" onclick="agregarVidrio()">Agregar Vidrio</button>
                    <button type="button" class="btn btn-cancel" onclick="limpiarPresupuesto()">Limpiar</button>
                </div>
                <div class="precio-display">
                    <label>Precio Total</label>
                    <div class="precio-value" id="total-presupuesto">$0.00</div>
                </div>
            </div>

            <div class="actions-section">
                <button type="button" class="btn btn-save" onclick="generarPDF()">Generar PDF</button>
            </div>

            <div id="msg-presupuesto"></div>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Vidrios Templados Lopez. Todos los derechos reservados.</p>
    </footer>

    <script src="config.js"></script>
    <script src="precios.js"></script>
    <script src="presupuesto.js"></script>
    <script src="pdf.js"></script>
</body>
</html>
